name: gcc x86_64 trunk

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - uses: msys2/setup-msys2@v2
        with:
          update: true

      - name: Cache buildroot
        uses: actions/cache@v4
        with:
          path: C:\buildroot
          key: buildroot-${{ runner.os }}-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            buildroot-${{ runner.os }}-

      - name: Cache MSYS2 packages
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pacman-${{ runner.os }}
          restore-keys: |
            msys2-pacman-

      - name: Build
        shell: msys2 {0}
        run: |
          ./build --mode=gcc-trunk --buildroot=/c/buildroot --jobs=4 --rev=trunk --rt-version=v13 \
            --threads=win32 --exceptions=seh --arch=x86_64 --bin-compress \
            --enable-languages=c,c++ --with-default-msvcrt=ucrt --logviewer-command=cat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: C:\buildroot\archives\*
          name: gcc-trunk